    <!--
      사이트 전역 WebApplication 정본. SSG 셸이 모든 라우트에 주입하므로
      뷰(HomeView 등)에서 중복 선언하지 않는다 — 같은 url을 가리키는 노드가
      둘이면 검색엔진이 서로 다른 엔티티로 읽는다. @id로 엔티티를 고정한다.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://shakilabs.com/seller#webapp",
        "name": "오픈마켓 수수료 비교 계산기",
        "description": "스마트스토어, 쿠팡, 11번가, G마켓 수수료를 한눈에 비교",
        "url": "https://shakilabs.com/seller",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" },
        "inLanguage": "ko"
      }
    </script>

    <script>
      (() => {
        try {
          const key = "seller-fee:theme:v1";
          const saved = localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";

          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // no-op
        }
      })();
    </script>
    <!-- Critical CSS: seller 테마 — 오렌지 커머스 톤 -->
    <style>
      :root {
        --background: 210 40% 98%;
        --foreground: 222 47% 11%;
        --muted: 210 40% 96%;
        --muted-foreground: 215 16% 37%;
        --card: 0 0% 100%;
        --card-foreground: 222 47% 11%;
        --primary: 25 85% 27%;
        --primary-foreground: 0 0% 100%;
        --secondary: 25 20% 93%;
        --secondary-foreground: 222 47% 11%;
        --accent: 25 80% 96%;
        --accent-foreground: 25 80% 35%;
        --popover: 0 0% 100%;
        --popover-foreground: 222 47% 11%;
        /* 에러 토스트(bg-destructive + destructive-foreground)를 픽셀로 재니 4.49:1로
           AA 미달이었다. 0 72% 52%는 --fee가 틴트 행에서 4.05:1로 걸렸던 바로 그 값이라,
           같은 함대 통일값(0 74% 42%)으로 내려 hue를 유지한 채 명도만 낮춘다.
           픽셀 실측: 토스트 4.49 → 6.14:1 / 흰 카드 위 글자 4.70 → 6.42:1 /
           1위 틴트 행 4.05 → 5.53:1. */
        --destructive: 0 74% 42%;
        --destructive-foreground: 210 40% 98%;
        --border: 214 16% 85%;
        --input: 214 16% 85%;
        --ring: 25 85% 27%;
        --radius: 0.4rem;
        --profit: 160 65% 25%;
        --profit-foreground: 0 0% 100%;
        /* 0 72% 52%는 홈 수수료 표의 1위 하이라이트 행(primary 9% 틴트) 위에서 4.05:1로
           실측 미달이었다. 함대 통일값 0 74% 42%로 내려 민무늬·틴트·다크 전 조합 4.5+를 확보한다. */
        --fee: 0 74% 42%;
        --fee-foreground: 0 0% 100%;
      }

      .dark {
        --background: 222 47% 11%;
        --foreground: 210 40% 96%;
        --muted: 217 33% 17%;
        --muted-foreground: 215 20% 72%;
        --card: 217 33% 17%;
        --card-foreground: 210 40% 96%;
        --primary: 24 82% 56%;
        --primary-foreground: 24 72% 12%;
        --secondary: 24 12% 19%;
        --secondary-foreground: 210 40% 96%;
        --accent: 24 16% 23%;
        --accent-foreground: 28 68% 82%;
        --popover: 217 33% 17%;
        --popover-foreground: 210 40% 96%;
        /* 다크에서 --destructive는 카드 위 글자색(text-destructive)이자 토스트 배경이다.
           0 72% 58%는 글자로 3.66:1, 흰 글자를 얹으면 4.05:1로 양쪽 다 미달이었다.
           밝은 적색 면 + 어두운 적색 잉크 조합으로 바꿔 두 방향 모두 통과시킨다. */
        --destructive: 0 75% 72%;
        --destructive-foreground: 0 72% 12%;
        --border: 214 16% 26%;
        --input: 214 16% 30%;
        --ring: 24 82% 56%;
        --profit: 160 56% 50%;
        /* 밝은 초록 위의 흰 글자는 2.15:1이었다. 앱 hue를 유지한 채 어둡게 해서 배지 글자를 살린다. */
        --profit-foreground: 160 72% 10%;
        /* 표의 수수료 셀(14px w600)이 카드 위에서 3.64:1로 렌더됐다(라이브 실측). 밝기를 올려 5.74:1로. */
        --fee: 0 75% 72%;
        --fee-foreground: 0 72% 12%;
      }

      html {
        scroll-behavior: auto;
        font-size: 16px;
      }

      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;

        overflow-x: hidden;
        margin: 0;
        color-scheme: light dark;
